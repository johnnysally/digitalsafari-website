<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <linearGradient id="g9" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#10b981"/>
            <stop offset="100%" style="stop-color:#0ea5e9"/>
        </linearGradient>
    </defs>
    
    <!-- Outer circle -->
    <circle cx="100" cy="100" r="95" fill="#0f172a"/>
    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#g9)" stroke-width="4"/>
    
    <!-- Inner ring -->
    <circle cx="100" cy="100" r="78" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- DS monogram -->
    <text x="100" y="112" font-family="Arial, sans-serif" font-size="52" font-weight="900" fill="url(#g9)" text-anchor="middle" letter-spacing="-2">DS</text>
    
    <!-- Divider line -->
    <line x1="65" y1="128" x2="135" y2="128" stroke="url(#g9)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Brand name -->
    <text x="100" y="150" font-family="Arial, sans-serif" font-size="13" fill="#64748b" text-anchor="middle" letter-spacing="3">DIGITALSAFARI</text>
</svg>